<section id="gallery" class="section">
  <div class="container">
    <h2 class="title is-2 has-text-centered mb-6">Галерея</h2>
    <div class="columns is-multiline">
      @for (img of galleryImages; track img) {
        <div class="column is-3">
          <figure class="image is-square">
            <img class="gallery-img shadow" [src]="img" alt="Optima Collection Gallery">
          </figure>
        </div>
      }
    </div>
  </div>
</section>
