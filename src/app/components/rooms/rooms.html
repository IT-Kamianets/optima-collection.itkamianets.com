<section id="rooms" class="section">
  <div class="container">
    <h2 class="title is-3 has-text-centered mb-6">Номери готелю Optima Collection Кам'янець-Подільський</h2>

    <div class="rooms-grid">
      @for (room of rooms; track room.id) {
        <div class="room-card">
          <div class="room-gallery">
            <button class="gallery-arrow left" (click)="prevImage(room)" [disabled]="room.images.length <= 1">
              <i class="fas fa-chevron-left"></i>
            </button>
            <img [src]="room.images[room.currentIndex]" [alt]="room.title" class="gallery-image">
            <button class="gallery-arrow right" (click)="nextImage(room)" [disabled]="room.images.length <= 1">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <div class="room-info">
            <h3 class="title is-5 room-title">{{ room.title }}</h3>
            <p class="room-description">{{ room.description }}</p>

            <div class="features-grid">
              <div class="features-col">
                @for (f of room.leftFeatures; track f.text) {
                  <div class="feature-item">
                    <i [class]="f.icon + ' feature-icon'"></i>
                    <span>{{ f.text }}</span>
                  </div>
                }
              </div>
              <div class="features-col">
                @for (f of room.rightFeatures; track f.text) {
                  <div class="feature-item">
                    <i [class]="f.icon + ' feature-icon'"></i>
                    <span>{{ f.text }}</span>
                  </div>
                }
              </div>
            </div>

            <div class="buttons mt-3">
              <a class="button is-primary is-small booking-btn" [href]="bookingUrl" target="_blank">
                Бронювати онлайн
              </a>
              <button class="button is-primary is-outlined is-small booking-btn" (click)="booking.open()">
                Бронювати
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
